services:
  agent-ti:
    image: t10/agent-ti:dev
    build: .
    # The smoke overlay's host file and agents, with the fixture under its Compose name.
    command: [serve, /etc/agent-ti/host/agent-ti.json]
    ports: ["127.0.0.1:28120:18120"]
    environment:
      FIXTURE_URL: http://fixture:8080
    volumes:
      - agent-ti-data:/data
      - ./deploy/k8s/overlays/smoke/agent-ti.json:/etc/agent-ti/host/agent-ti.json:ro
      - ./deploy/k8s/overlays/smoke/agents:/etc/agent-ti/agents:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 40s
    depends_on:
      fixture: {condition: service_healthy}
  fixture:
    ports: ["127.0.0.1:28121:8080"]
    image: node:24.21.0-bookworm-slim
    command: [node, /fixture/fixture.mjs]
    user: "10001:10001"
    volumes: ["./scripts/fixture.mjs:/fixture/fixture.mjs:ro"]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agent-ti-data:
