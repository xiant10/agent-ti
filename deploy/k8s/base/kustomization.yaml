apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t10
resources: [workload.yaml, networkpolicy.yaml]
configMapGenerator:
  # The host file, and one ConfigMap per agent directory, mounted where the host file names them.
  - name: agent-ti-host
    files: [config/agent-ti.json]
  - name: agent-ti-agent-ti
    files: [agents/ti/agent.json, agents/ti/base.md, agents/ti/voice.md]
