apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t10
resources: [workload.yaml, networkpolicy.yaml]
configMapGenerator:
  # The host file, which the image also carries. The runtime has no agents of its own: it
  # loads each folder in /etc/agent-ti/agents, which whoever deploys it fills, as t10-agents does.
  - name: agent-ti-host
    files: [config/agent-ti.json]
