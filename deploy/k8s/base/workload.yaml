apiVersion: v1
kind: Service
metadata:
  name: agent-ti
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: agent-ti}
  ports:
    - {name: http, port: 18120, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-ti
spec:
  serviceName: agent-ti
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agent-ti}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-ti
        t10.dev/auth-client: "true"
        t10.dev/llm-client: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent-ti
          image: t10/agent-ti:dev
          imagePullPolicy: IfNotPresent
          args: [serve, /etc/agent-ti/host/agent-ti.json]
          ports: [{name: http, containerPort: 18120}]
          envFrom:
            - secretRef: {name: agent-ti}
          env:
            # A replica's name, and so its sessions' IDs: agent-ti-0, agent-ti-1, ...
            - name: AGENT_INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # Tenant skills and connectors (step 7), as agent-pi's assistant has them.
            - {name: AUTH_URL, value: "http://auth-server.t10.svc.cluster.local:18000"}
            - {name: AGENT_CONTROL_URL, value: "http://t10-agent-control.t10.svc.cluster.local:18010"}
            - {name: TOOL_GATEWAY_URL, value: "http://ai-gateway-tools.t10.svc.cluster.local:18095"}
            - {name: AGENT_GRANTS_CLIENT_ID, value: "agent-ti"}
            - {name: MODULES_MCP_URL, value: "http://ai-gateway-tools.t10.svc.cluster.local:18095/mcp/modules"}
            - {name: KNOWLEDGE_MCP_URL, value: "http://ai-gateway-tools.t10.svc.cluster.local:18095/mcp/knowledge"}
            - {name: GRANT_ACTIONS, value: "agent:use,work:read,work:write,knowledge:read,property:read,property:propose"}
            - {name: GRANT_AUDIENCES, value: "agent-ti,t10-collab,t10-knowledge,t10-property,ai-gateway-tools"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: agent-ti, mountPath: /etc/agent-ti/agents/ti, readOnly: true}
            - {name: agent-property, mountPath: /etc/agent-ti/agents/property, readOnly: true}
            - {name: host, mountPath: /etc/agent-ti/host, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: host, configMap: {name: agent-ti-host}}
        - {name: agent-ti, configMap: {name: agent-ti-agent-ti}}
        - {name: agent-property, configMap: {name: agent-ti-agent-property}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
