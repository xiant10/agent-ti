apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-gateway-agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ai-gateway-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ai-gateway-agent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: ai-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/gateway/config.agent.yaml"]
          ports: [{name: http, containerPort: 18090}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/gateway, readOnly: true}
      volumes:
        - {name: config, configMap: {name: agent-ti-gateway}}
---
apiVersion: v1
kind: Service
metadata: {name: ai-gateway-agent}
spec:
  selector: {app.kubernetes.io/name: ai-gateway-agent}
  ports: [{name: http, port: 18090, targetPort: http}]
