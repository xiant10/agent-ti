apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-ti-test
resources: [../../base, namespace.yaml, fixture.yaml]
configMapGenerator:
  - name: agent-ti-host
    behavior: replace
    files: [agent-ti.json]
  # The test agents, mounted where this host file names them, as any deployment adds its own.
  - name: agent-ti-agent-ti-demo
    files: [agents/ti-demo/agent.json, agents/ti-demo/base.md, agents/ti-demo/context.md, agents/ti-demo/faq.json, agents/ti-demo/helper.md, guided.md=agents/ti-demo/skills/guided.md, lookup-SKILL.md=agents/ti-demo/skills/lookup/SKILL.md, lookup-flow.json=agents/ti-demo/skills/lookup/flow.json]
  - name: agent-ti-agent-ti-plain
    files: [agents/ti-plain/agent.json, agents/ti-plain/base.md]
  - name: agent-ti-agent-ti-ack
    files: [agents/ti-ack/agent.json, agents/ti-ack/base.md]
  - name: agent-ti-fixture
    files: [fixture.mjs]
patches:
  - target: {kind: StatefulSet, name: agent-ti}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/envFrom, value: []}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: ti-demo, mountPath: /etc/agent-ti/agents/ti-demo, readOnly: true}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: ti-plain, mountPath: /etc/agent-ti/agents/ti-plain, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: ti-plain, configMap: {name: agent-ti-agent-ti-plain}}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: ti-ack, mountPath: /etc/agent-ti/agents/ti-ack, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: ti-ack, configMap: {name: agent-ti-agent-ti-ack}}
      # A ConfigMap key can't hold a slash; `items` gives the skill files their folders.
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ti-demo
          configMap:
            name: agent-ti-agent-ti-demo
            items:
              - {key: agent.json, path: agent.json}
              - {key: base.md, path: base.md}
              - {key: context.md, path: context.md}
              - {key: faq.json, path: faq.json}
              - {key: helper.md, path: helper.md}
              - {key: guided.md, path: skills/guided.md}
              - {key: lookup-SKILL.md, path: skills/lookup/SKILL.md}
              - {key: lookup-flow.json, path: skills/lookup/flow.json}
